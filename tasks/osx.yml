---
# .osx must run as the user (it refuses root) and authenticates sudo before
# changing anything, but Ansible gives it no terminal to prompt on. While it
# runs, let the user run exactly the script's sudo commands without a password;
# verifypw=any lets its `sudo -v` preflight pass on those NOPASSWD entries.
# The grant is removed afterwards, so the net change is none.
- name: Run .osx dotfiles with its sudo commands allowed.
  block:
    - name: Allow .osx sudo commands without a password.
      copy:
        content: |
          Defaults:{{ ansible_facts['user_id'] }} verifypw=any
          {{ ansible_facts['user_id'] }} ALL=(root) NOPASSWD: /usr/sbin/systemsetup -setrestartfreeze on, /usr/bin/mdutil -i on /, /usr/bin/mdutil -E /
        dest: /private/etc/sudoers.d/osx-dotfiles
        mode: 0440
        validate: 'visudo -cf %s'
      changed_when: false
      become: true

    - name: Run .osx dotfiles.
      command: "{{ osx_script }}"
      changed_when: false

  always:
    - name: Remove .osx sudo command allowance.
      file:
        path: /private/etc/sudoers.d/osx-dotfiles
        state: absent
      changed_when: false
      become: true
