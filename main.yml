---
- name: Configure host.
  hosts: all

  vars_files:
    - default.config.yml

  # -K hands the password to become only; casks whose installers run sudo
  # (zoom, blockblock, ...) get it from ansible_become_password via the
  # homebrew_cask module's SUDO_ASKPASS. Prompting for the variable feeds both.
  # Non-interactive runs (CI) skip the prompt and use the empty default.
  vars_prompt:
    - name: ansible_become_password
      prompt: BECOME password
      private: true
      unsafe: true
      default: ""

  pre_tasks:
    - name: Ensure a config.yml override exists.
      assert:
        that: lookup('ansible.builtin.fileglob', playbook_dir ~ '/config.yml') | length > 0
        fail_msg: >-
          No config.yml next to main.yml, so only default.config.yml would
          apply. Create or link config.yml first (bootstrap.sh links it from
          the dotfiles repository).
        quiet: true
      tags: ['always']

    # sudo asks a paired smart card for its PIN before the password, so a
    # become or SUDO_ASKPASS password would be spent as a PIN attempt.
    - name: Look for an inserted smart card.
      command: security list-smartcards
      register: smartcards
      changed_when: false
      failed_when: false
      check_mode: false
      tags: ['always']

    - name: Stop while a smart card is inserted.
      fail:
        msg: >-
          A smart card such as a YubiKey is inserted. sudo would read the
          become password as its PIN, and wrong PINs lock the card. Unplug it
          and rerun.
      when: smartcards.stdout_lines | select('search', ':') | list | length > 0
      tags: ['always']

    - name: Include playbook configuration.
      include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
      tags: ['always']

  roles:
    - role: inxbit.osx-command-line-tools
    - role: geerlingguy.mac.homebrew
      tags: ['homebrew']
    - role: geerlingguy.dotfiles
      when: configure_dotfiles
      tags: ['dotfiles']
    - role: geerlingguy.mac.mas
      when: (mas_installed_apps | length > 0) or (mas_installed_app_ids | length > 0)
      tags: ['mas']
    - role: geerlingguy.mac.dock
      when: configure_dock
      tags: ['dock']

  tasks:
    - import_tasks: tasks/sudoers.yml
      when: configure_sudoers
      tags: ['sudoers']

    - import_tasks: tasks/terminal.yml
      when: configure_terminal
      tags: ['terminal']

    - import_tasks: tasks/osx.yml
      when: configure_osx
      tags: ['osx']

    - import_tasks: tasks/extra-packages.yml
      tags: ['extra-packages']

    - import_tasks: tasks/sublime-text.yml
      when: configure_sublime
      tags: ['sublime-text']

    - name: Run post-provision task files in a block.
      tags: ['post']
      block:
        - name: Run configured post-provision ansible task files.
          include_tasks: "{{ outer_item }}"
          loop_control:
            loop_var: outer_item
          with_fileglob: "{{ post_provision_tasks | default(omit) }}"
